name: Video Downloader

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '🔗 YouTube video URL(s) (separate multiple URLs with spaces)'
        required: true
        type: string
      quality:
        description: '🎬 Video quality'
        required: true
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      output_name:
        description: '📝 Output file name (optional, without extension)'
        required: false
        type: string

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup FFmpeg and yt-dlp
        run: |
          # Install dependencies
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg zip
          
          # Install yt-dlp
          pip install --upgrade yt-dlp
          
          # Verify installations
          ffmpeg -version | head -n 1
          yt-dlp --version

      - name: Prepare videos branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch all branches
          git fetch --all
          
          # Check if videos branch exists
          if git show-ref --verify --quiet refs/heads/videos; then
            git checkout videos
            git pull origin videos --no-rebase
          else
            # Create orphan branch if it doesn't exist
            git checkout --orphan videos
            git rm -rf . || true
            mkdir -p videos
            echo "# Video Storage" > README.md
            echo "This branch stores downloaded videos." >> README.md
            git add README.md
            git commit -m "Initialize videos branch"
            git push -u origin videos
          fi

      - name: Download videos
        id: download
        run: |
          # Create temporary directory
          mkdir -p tmpvideos
          cd tmpvideos
          
          # Parse quality settings
          QUALITY="${{ inputs.quality }}"
          
          if [ "$QUALITY" = "audio" ]; then
            FORMAT_OPTS="-f bestaudio --extract-audio --audio-format mp3 --audio-quality 0"
            EXTENSION="mp3"
          elif [ "$QUALITY" = "best" ]; then
            FORMAT_OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
            EXTENSION="mp4"
          else
            FORMAT_OPTS="-f \"bestvideo[height<=${QUALITY}]+bestaudio/best[height<=${QUALITY}]\" --merge-output-format mp4"
            EXTENSION="mp4"
          fi
          
          # Parse output name
          OUTPUT_NAME="${{ inputs.output_name }}"
          if [ -n "$OUTPUT_NAME" ]; then
            OUTPUT_OPTS="-o \"${OUTPUT_NAME}.%(ext)s\""
          else
            OUTPUT_OPTS="-o \"%(title)s.%(ext)s\""
          fi
          
          # Handle multiple URLs
          echo "Downloading videos..."
          IFS=' ' read -ra URLS <<< "${{ inputs.youtube_url }}"
          
          for url in "${URLS[@]}"; do
            echo "Downloading: $url"
            eval yt-dlp $FORMAT_OPTS $OUTPUT_OPTS \
              --no-playlist \
              --restrict-filenames \
              --progress \
              --no-mtime \
              "$url"
          done
          
          # List downloaded files
          echo "Downloaded files:"
          ls -la
          
          # Get list of downloaded files for the next step
          ls -1 > ../filelist.txt
          
          cd ..

      - name: Package and move videos
        run: |
          # Create videos directory if it doesn't exist
          mkdir -p videos
          
          # Process each downloaded file
          while IFS= read -r file; do
            if [ -f "tmpvideos/$file" ] && [ -n "$file" ]; then
              # Clean filename for safe storage
              safe_name=$(echo "$file" | sed 's/[^a-zA-Z0-9._-]/_/g')
              
              # For files larger than 45MB, split into parts
              file_size=$(stat -c%s "tmpvideos/$file")
              max_size=$((45 * 1024 * 1024)) # 45MB in bytes
              
              if [ $file_size -gt $max_size ]; then
                echo "Splitting large file: $file (${file_size} bytes)"
                cd tmpvideos
                zip -s 45m "../videos/${safe_name}.zip" "$file"
                cd ..
              else
                echo "Moving file: $file"
                mv "tmpvideos/$file" "videos/${safe_name}"
              fi
            fi
          done < filelist.txt
          
          # Clean up
          rm -rf tmpvideos filelist.txt
          
          # List videos in storage
          echo "Videos in storage:"
          ls -la videos/

      - name: Generate Download Links
        run: |
          cat > README.md << 'EOF'
          # 📥 Video Download Links
          
          **Generated on:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          > Click on any link below to download your video file.
          
          ## Available Downloads
          
          EOF
          
          # Generate download links
          for file in videos/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              # URL encode the filename
              encoded_filename=$(printf '%s' "$filename" | od -An -tx1 | tr ' ' % | sed 's/%%/%/g' | sed 's/%0a//g')
              url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/videos/videos/${encoded_filename}"
              
              # Get file size
              file_size=$(stat -c%s "$file")
              if [ $file_size -gt 1048576 ]; then
                size_display="$((file_size / 1048576)) MB"
              else
                size_display="$((file_size / 1024)) KB"
              fi
              
              echo "- [${filename}](${url}) - ${size_display}" >> README.md
            fi
          done
          
          # Add footer
          cat >> README.md << 'EOF'
          
          ---
          *Files will remain available in the \`videos\` branch of this repository.*
          EOF
          
          echo "README.md generated:"
          cat README.md

      - name: Commit and push changes
        run: |
          # Switch to videos branch
          git checkout videos
          
          # Add all changes
          git add README.md videos/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Create commit message with timestamp
            timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
            git commit -m "[bot] Update videos - ${timestamp}"
            
            # Push to remote
            git push origin videos
            
            echo "Changes pushed successfully"
          fi
          
          # Switch back to main branch
          git checkout main 2>/dev/null || true

      - name: Summary
        run: |
          echo "## Download Complete 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Videos have been downloaded and stored in the \`videos\` branch.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Add links to summary
          for file in videos/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "- [${filename}](https://github.com/${GITHUB_REPOSITORY}/blob/videos/videos/${filename})" >> $GITHUB_STEP_SUMMARY
            fi
          done        
